# The format version is an indicator of the compatibility of community exercises with the
# Rustlings program.
# The format version is not the same as the version of the Rustlings program.
# In case Rustlings makes an unavoidable breaking change to the expected format of community
# exercises, you would need to raise this version and adapt to the new format.
# Otherwise, the newest version of the Rustlings program won't be able to run these exercises.
format_version = 1

# Optional multi-line message to be shown to users when just starting with the exercises.
welcome_message = """Willkommen bei diesen deutschen Community-Übungen für Rustlings."""

# Optional multi-line message to be shown to users after finishing all exercises.
final_message = """Wir hoffen, dass dir diese Übungen geholfen haben :D"""

# Repeat this section for every exercise.
[[exercises]]
name = "intro1"
dir = "00_intro"
test = false
skip_check_unsolved = true
hint = """
Gib `n` ein, um zur nächsten Übung zu wechseln.
Möglicherweise musst du nach der Eingabe von `n` noch ENTER drücken.
"""

[[exercises]]
name = "intro2"
dir = "00_intro"
test = false
hint = """
Der Compiler weist uns darauf hin, dass wir den Namen des Print-Makros falsch
geschrieben haben. Er schlägt auch eine Alternative vor.
"""

[[exercises]]
name = "variables1"
dir = "01_variables"
test = false
hint = """
Der Deklaration in der `main`-Funktion fehlt ein Schlüsselwort, das in Rust
nötig ist, um eine neue Variablenbindung zu erzeugen.
"""

[[exercises]]
name = "variables2"
dir = "01_variables"
test = false
hint = """
Die Compiler-Meldung sagt, dass Rust den Typ der Variablenbindung `x` nicht
mit dem hier gegebenen Wert in Einklang bringen kann.

Was passiert, wenn du die erste Zeile in der `main`-Funktion mit einer
Typ-Annotation versiehst?

Was, wenn du `x` einen Wert gibst?

Was, wenn du beides tust?

Welchen Typ sollte `x` überhaupt haben?

Was, wenn `x` denselben Typ wie `10` hat? Was, wenn es ein anderer Typ ist?
"""

[[exercises]]
name = "variables3"
dir = "01_variables"
test = false
hint = """
In dieser Übung haben wir eine Variablenbindung, die wir in der
`main`-Funktion erzeugt haben, und wir versuchen, sie in der nächsten Zeile zu
benutzen — aber wir haben ihr noch keinen Wert gegeben.

Wir können nichts ausgeben, das es nicht gibt; versuch, `x` einen Wert zu
geben!

Das ist ein Fehler, der in jeder Programmiersprache sehr leicht passieren und
Bugs verursachen kann — zum Glück hat der Rust-Compiler das für uns erkannt!
"""

[[exercises]]
name = "variables4"
dir = "01_variables"
test = false
hint = """
In Rust sind Variablenbindungen standardmäßig unveränderlich. Aber hier
versuchen wir, `x` einen anderen Wert zuzuweisen! Es gibt ein Schlüsselwort,
mit dem wir eine Variablenbindung stattdessen veränderlich machen können.
"""

[[exercises]]
name = "variables5"
dir = "01_variables"
test = false
hint = """
Bei `variables4` haben wir schon gelernt, wie man eine unveränderliche
Variable mit einem speziellen Schlüsselwort veränderlich macht. Leider hilft
uns das hier nicht viel weiter, weil wir einer bestehenden Variable einen Wert
eines anderen Typs zuweisen wollen. Manchmal möchte man auch bestehende
Variablennamen wiederverwenden, weil man wie in dieser Übung nur Werte in
andere Typen umwandelt.

Zum Glück hat Rust dafür eine elegante Lösung: 'Shadowing'!
Mehr über 'Shadowing' erfährst du im Abschnitt 'Variables and Mutability' des
Buchs:
https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing

Versuch anschließend, die Übung mit dieser Technik zu lösen.
"""

[[exercises]]
name = "variables6"
dir = "01_variables"
test = false
hint = """
Wir kennen bereits Variablen und Veränderlichkeit, aber es gibt noch eine
weitere wichtige Art von Variable: Konstanten.

Konstanten sind immer unveränderlich. Sie werden mit dem Schlüsselwort
`const` statt `let` deklariert.

Der Typ von Konstanten muss immer angegeben werden.

Mehr über Konstanten und die Unterschiede zwischen Variablen und Konstanten
erfährst du im Abschnitt 'Constants' im Buch-Kapitel 'Variables and
Mutability':
https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#constants
"""

[[exercises]]
name = "functions1"
dir = "02_functions"
test = false
hint = """
Diese `main`-Funktion ruft eine Funktion auf, von der sie erwartet, dass es
sie gibt — die Funktion existiert aber nicht. Sie erwartet, dass diese
Funktion `call_me` heißt. Außerdem erwartet sie, dass diese Funktion keine
Argumente entgegennimmt und keinen Wert zurückgibt. Klingt ziemlich nach
`main`, oder?
"""

[[exercises]]
name = "functions2"
dir = "02_functions"
test = false
hint = """
Rust verlangt, dass alle Teile der Signatur einer Funktion mit
Typ-Annotationen versehen sind, aber `call_me` fehlt die Typ-Annotation von
`num`.
"""

[[exercises]]
name = "functions3"
dir = "02_functions"
test = false
hint = """
Diesmal ist die Funktions-*deklaration* in Ordnung, aber an der Stelle, an
der wir die Funktion aufrufen, stimmt etwas nicht.
"""

[[exercises]]
name = "functions4"
dir = "02_functions"
test = false
hint = """
Die Fehlermeldung bezieht sich auf die Funktion `sale_price` und sagt, dass
nach `->` ein Typ erwartet wird. Genau dort sollte der Rückgabetyp der
Funktion stehen. Schau dir die Funktion `is_even` als Beispiel an!
"""

[[exercises]]
name = "functions5"
dir = "02_functions"
test = false
hint = """
Das ist ein wirklich häufiger Fehler, der sich durch das Entfernen eines
einzigen Zeichens beheben lässt. Er passiert, weil Rust zwischen Ausdrücken
(Expressions) und Anweisungen (Statements) unterscheidet: Ausdrücke geben
abhängig von ihren Operanden einen Wert zurück, Anweisungen geben einfach den
Typ `()` zurück, der sich wie `void` in C/C++ verhält.

Wir wollen aus der Funktion `square` einen Wert vom Typ `i32` zurückgeben,
aber sie gibt gerade den Typ `()` zurück.

Es gibt zwei Lösungen:
1. Das Schlüsselwort `return` vor `num * num;` hinzufügen
2. Das Semikolon `;` nach `num * num` entfernen
"""

[[exercises]]
name = "if1"
dir = "03_if"
hint = """
Das lässt sich, wenn du magst, sogar in einer einzigen Zeile lösen!

Ähnliche Beispiele aus anderen Sprachen:
- In C(++) wäre das: `a > b ? a : b`
- In Python wäre das: `a if a > b else b`

Denk in Rust daran, dass:
- die `if`-Bedingung keine Klammern braucht
- `if`/`else`-Bedingungen Ausdrücke (Expressions) sind
- auf jede Bedingung ein `{}`-Block folgt
"""

[[exercises]]
name = "if2"
dir = "03_if"
hint = """
Für den ersten Compiler-Fehler ist wichtig: In Rust muss jeder Zweig einer
Bedingung denselben Typ zurückgeben!

Um die Tests zum Bestehen zu bringen, brauchst du ein paar Bedingungen, die
verschiedene Eingabewerte prüfen. Lies die Tests, um herauszufinden, was sie
erwarten.
"""

[[exercises]]
name = "if3"
dir = "03_if"
hint = """
In Rust muss jeder Zweig eines `if`-Ausdrucks denselben Werttyp zurückgeben.
Stell sicher, dass der Typ in allen Zweigen einheitlich ist.
"""

[[exercises]]
name = "primitive_types1"
dir = "04_primitive_types"
test = false
hint = """
In Rust kann ein boolescher Wert verneint werden, indem man den Operator `!`
davor schreibt.
Beispiel: `!true == false`
Das funktioniert auch mit booleschen Variablen.
"""

[[exercises]]
name = "primitive_types2"
dir = "04_primitive_types"
test = false
hint = """
Diesmal kein Hinweis ;)
"""

[[exercises]]
name = "primitive_types3"
dir = "04_primitive_types"
test = false
hint = """
Es gibt eine Kurzschreibweise, um Arrays mit einer bestimmten Größe zu
initialisieren, ohne 100 Elemente einzeln eintippen zu müssen (auch wenn du
das natürlich gerne tun kannst!).

Zum Beispiel geht das so:
```
let array = ["Sind wir schon da?"; 100];
```

Bonus: Was gibt es sonst noch, das für `a.len() >= 100` `true` ergeben würde?
"""

[[exercises]]
name = "primitive_types4"
dir = "04_primitive_types"
hint = """
Wirf einen Blick in den Abschnitt 'Understanding Ownership -> Slices -> Other
Slices' des Buchs: https://doc.rust-lang.org/book/ch04-03-slices.html und
nutze den Start- und (End-plus-eins-)Index der Elemente im Array, die im
Slice landen sollen.

Falls dich interessiert, warum das erste Argument von `assert_eq!` kein `&`
für eine Referenz hat, obwohl das zweite Argument eine Referenz ist, wirf
einen Blick ins Coercion-Kapitel des Nomicon:
https://doc.rust-lang.org/nomicon/coercions.html
"""

[[exercises]]
name = "primitive_types5"
dir = "04_primitive_types"
test = false
hint = """
Wirf einen Blick in den Abschnitt 'Data Types -> The Tuple Type' des Buchs:
https://doc.rust-lang.org/book/ch03-02-data-types.html#the-tuple-type
Insbesondere den Teil über Destrukturierung (vorletztes Beispiel im
Abschnitt).

Du musst ein Muster bauen, um `name` und `age` an die passenden Teile des
Tupels zu binden.
"""

[[exercises]]
name = "primitive_types6"
dir = "04_primitive_types"
hint = """
Auch wenn du hier ein destrukturierendes `let` für das Tupel verwenden
könntest, versuch stattdessen, per Index darauf zuzugreifen — wie im letzten
Beispiel des Abschnitts 'Data Types -> The Tuple Type' des Buchs erklärt:
https://doc.rust-lang.org/book/ch03-02-data-types.html#the-tuple-type
Jetzt hast du ein weiteres Werkzeug in deinem Werkzeugkasten!
"""

[[exercises]]
name = "vecs1"
dir = "05_vecs"
hint = """
In Rust gibt es zwei Wege, einen Vektor zu definieren.
1. Der eine Weg ist, mit der Funktion `Vec::new()` einen neuen Vektor zu
   erzeugen und ihn mit der Methode `push()` zu befüllen.
2. Der zweite Weg ist, das Makro `vec![]` zu nutzen und deine Elemente
   innerhalb der eckigen Klammern anzugeben. Dieser Weg ist einfacher, wenn
   du die Anfangswerte genau kennst.

Schau dir dieses Kapitel an: https://doc.rust-lang.org/book/ch08-01-vectors.html
des Rust-Buchs, um mehr zu erfahren.
"""

[[exercises]]
name = "vecs2"
dir = "05_vecs"
hint = """
In der ersten Funktion erzeugen wir einen leeren Vektor und wollen neue
Elemente an ihn anhängen.

In der zweiten Funktion bilden wir die Werte der Eingabe ab (map) und
sammeln sie in einem Vektor.

Wenn du beide Funktionen fertiggestellt hast, entscheide für dich selbst,
welchen Ansatz du besser findest.

Was glaubst du, welches Muster unter Rust-Entwicklern gebräuchlicher ist?
"""
