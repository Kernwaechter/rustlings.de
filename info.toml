"""

[[exercises]]
name = "errors5"
dir = "13_error_handling"
test = false
hint = """
Innerhalb der `main`-Funktion werden zwei verschiedene mögliche
`Result`-Typen erzeugt, die mit dem `?`-Operator weitergereicht werden.
Wie deklarieren wir einen Rückgabetyp für die `main`-Funktion, der beide
zulässt?

Unter der Haube ruft der `?`-Operator `From::from` auf dem Fehlerwert auf,
um ihn in ein geboxtes Trait-Objekt umzuwandeln, ein `Box<dyn Error>`.
Dieses geboxte Trait-Objekt ist polymorph, und da alle Fehler den Trait
`Error` implementieren, können wir viele verschiedene Fehler in einem
einzigen `Box`-Objekt einfangen.

Schau dir diesen Abschnitt von „The Book“ an:
https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html#a-shortcut-for-propagating-errors-the--operator

Mehr über das Boxen von Fehlern:
https://doc.rust-lang.org/stable/rust-by-example/error/multiple_error_types/boxing_errors.html

Mehr über die Benutzung des `?`-Operators mit geboxten Fehlern:
https://doc.rust-lang.org/stable/rust-by-example/error/multiple_error_types/reenter_question_mark.html
"""

