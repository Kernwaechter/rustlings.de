[[exercises]]
name = "options1"
dir = "12_options"
hint = """
Optionen können einen `Some`-Wert mit einem inneren Wert haben oder einen
`None`-Wert ohne inneren Wert.

Es gibt mehrere Wege, an den inneren Wert zu kommen: Du kannst `unwrap`
benutzen oder Pattern-Matching. Unwrapping ist am einfachsten, aber wie
machst du es sicher, sodass es dir nicht später um die Ohren fliegt?
"""

[[exercises]]
name = "options2"
dir = "12_options"
hint = """
Schau dir das an:

- https://doc.rust-lang.org/rust-by-example/flow_control/if_let.html
- https://doc.rust-lang.org/rust-by-example/flow_control/while_let.html

