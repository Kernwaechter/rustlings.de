sein können.

Zum Beispiel: `if let Some(Some(x)) = y`

Schau dir auch `Option::flatten` an.
"""

[[exercises]]
name = "options3"
dir = "12_options"
test = false
hint = """
Der Compiler sagt, dass in der `match`-Anweisung ein Teil-Move (partial
move) stattgefunden hat. Wie lässt sich das vermeiden? Der Compiler zeigt
dir die nötige Korrektur.

Lies dir nach der vom Compiler vorgeschlagenen Korrektur die zugehörige
Doku-Seite durch:
https://doc.rust-lang.org/std/keyword.ref.html
"""

[[exercises]]
name = "errors1"
dir = "13_error_handling"
hint = """
`Ok` und `Err` sind die zwei Varianten von `Result`. Die Tests sagen also,
dass `generate_nametag_text` ein `Result` statt einer `Option` zurückgeben
sollte.

Um das zu ändern, musst du:
  - den Rückgabetyp in der Funktionssignatur zu `Result<String, String>`
    ändern, mit den möglichen Varianten `Ok(String)` und `Err(String)`
  - den Funktionsrumpf so ändern, dass `Ok(…)` zurückgegeben wird, wo
    aktuell `Some(…)` zurückgegeben wird
  - den Funktionsrumpf so ändern, dass `Err(Fehlermeldung)` zurückgegeben
    wird, wo aktuell `None` zurückgegeben wird
"""

[[exercises]]
name = "errors2"
dir = "13_error_handling"
hint = """
Ein Weg, das zu behandeln, ist eine `match`-Anweisung auf
`item_quantity.parse::<i32>()`, deren Fälle `Ok(irgendwas)` und
`Err(irgendwas)` sind.

Dieses Muster ist in Rust aber so verbreitet, dass es dafür den
`?`-Operator gibt, der genau das für dich erledigt, was diese
match-Anweisung tun würde!

Schau dir diesen Abschnitt des Kapitels „Error Handling“ an:
https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html#a-shortcut-for-propagating-errors-the--operator
"""

