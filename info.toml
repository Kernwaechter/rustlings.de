Die Funktion `result_with_list` muss ein einzelnes `Result` zurückgeben,
bei dem der Erfolgsfall ein Vektor von Ganzzahlen ist und der Fehlerfall
ein `DivisionError`.

Die Funktion `list_of_results` muss einen Vektor von Results zurückgeben.

Schau dir an, wie der Trait `FromIterator` in `collect()` benutzt wird:
https://doc.rust-lang.org/std/iter/trait.Iterator.html#method.collect
Dieser Trait ist WIRKLICH mächtig! Er kann die Lösung dieser Übung deutlich
einfacher machen.
"""

